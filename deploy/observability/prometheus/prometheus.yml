global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: gophprofile-server
    static_configs:
      - targets: ['server:9090']
        labels:
          service: gophprofile-server

  - job_name: gophprofile-worker
    static_configs:
      - targets: ['worker:9090']
        labels:
          service: gophprofile-worker

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq-exporter:9419']
