server:
  replicaCount: 2
  image:
    pullPolicy: Never

worker:
  replicaCount: 1
  image:
    pullPolicy: Never

client:
  image:
    pullPolicy: Never

ingress:
  host: gophprofile.local
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web

networkPolicy:
  enabled: false

config:
  otelEnabled: "false"

secrets:
  # Локальные dev-значения; в values.yaml секреты пустые — required сработает без --set
  secretKey: "01234567890123456789012345678901"
  databaseDSN: "host=postgres.database.svc.cluster.local port=5432 user=gophprofile password=gophprofile dbname=gophprofile sslmode=disable"
  minioAccessKey: gophprofile
  minioSecretKey: gophprofile
  rabbitmqPassword: gophprofile

hpa:
  server:
    minReplicas: 2
    maxReplicas: 5
  worker:
    minReplicas: 1
    maxReplicas: 3

monitoring:
  serviceMonitor:
    enabled: false
