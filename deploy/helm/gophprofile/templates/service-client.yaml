apiVersion: v1
kind: Service
metadata:
  name: {{ include "gophprofile.fullname" . }}-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gophprofile.client.labels" . | nindent 4 }}
spec:
  selector:
    app: gophprofile-client
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.client.service.port }}
      targetPort: http
  type: ClusterIP
