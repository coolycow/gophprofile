version: '3.8'

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  gophprofile_data:

networks:
  gophprofile_net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400

services:
  # Client на основе готового фронтенд-приложения
  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
    image: gophprofile/client:latest
    container_name: client
    ports:
      - "8332:8000"
    environment:
      - CLIENT_MAX_BODY_SIZE=${CLIENT_MAX_BODY_SIZE:-25m}
    volumes:
      - ./web/static:/var/www/html
    depends_on:
      - server
    networks:
      - gophprofile_net

  # Server
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    image: gophprofile/server:latest
    container_name: server
    ports:
      - "8333:8080"
    environment:
      # Иначе Listen на 127.0.0.1 — с хоста через publish портов запрос не попадает в процесс (empty response).
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8080}
      - TARGETOS=${TARGETOS:-linux}
      - TARGETARCH=${TARGETARCH:-amd64}
      - GO_SERVER_MAIN_PATH=${GO_SERVER_MAIN_PATH:-./cmd/server}
      - DATABASE_DSN=${DATABASE_DSN:-host=postgres port=5432 user=gophprofile password=gophprofile dbname=gophprofile sslmode=disable}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      # API MinIO на 9000; имя хоста резолвится только во внутренней сети compose
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-gophprofile}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-gophprofile}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-gophprofile}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - AUDIT_FILE=${AUDIT_FILE:-/tmp/audit_server.json}
    volumes:
      - gophprofile_data:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - gophprofile_net

  # Worker
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: gophprofile/worker:latest
    container_name: worker
    environment:
      - TARGETOS=${TARGETOS:-linux}
      - TARGETARCH=${TARGETARCH:-amd64}
      - GO_WORKER_MAIN_PATH=${GO_WORKER_MAIN_PATH:-./cmd/worker}
      - DATABASE_DSN=${DATABASE_DSN:-host=postgres port=5432 user=gophprofile password=gophprofile dbname=gophprofile sslmode=disable}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-gophprofile}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-gophprofile}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-gophprofile}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - AUDIT_FILE=${AUDIT_FILE:-/tmp/audit_worker.json}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - gophprofile_net

  # POSTGRESQL
  postgres:
    image: "postgres:18"
    container_name: postgres
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "/scripts/pg_healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    env_file:
      - docker/postgres/.env
    volumes:
      - ./scripts:/scripts
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gophprofile_net

  # RABBITMQ
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # AMQP для приложений
      - "15672:15672"   # Веб-панель управления
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+sbwt none +sbwtdcpu none +sbwtdio none"
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-gophprofile}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-gophprofile}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gophprofile_net

  # MinIO
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gophprofile}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gophprofile}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-gophprofile}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-gophprofile}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-gophprofile}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - gophprofile_net